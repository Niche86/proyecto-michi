<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu resultado - {{ gato.nombre }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f0f0f0;
        }
        .card {
            background-color: white;
            border: 1px solid #ccc;
            padding: 30px;
            margin-top: 30px;
        }
        h1 {
            color: #333;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
        }
        a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Eres...</h2>
        <h1>{{ gato.nombre }}</h1>

        {% load static %}
        <img src="{% static gato.imagen %}" alt="{{ gato.nombre }}">

        <p>{{ gato.descripcion }}</p>

        <a href="{% url 'index' %}">Hacer el test otra vez</a>
    </div>
</body>
</html>
