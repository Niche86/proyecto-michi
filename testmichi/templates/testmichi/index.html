<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué Michi Eres?</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .pregunta {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        .pregunta-texto {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .respuestas {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .respuesta label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .respuesta label:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .respuesta input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
        }
        .btn-enviar {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn-enviar:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¿Qué Michi Eres? 🐱</h1>
        <p class="subtitle">Descubre tu personalidad ante el estrés universitario</p>
        
        <form method="post" action="{% url 'procesar' %}">
            {% csrf_token %}
            
            {% for pregunta in preguntas %}
            <div class="pregunta">
                <div class="pregunta-texto">{{ forloop.counter }}. {{ pregunta.texto }}</div>
                <div class="respuestas">
                    {% for respuesta in pregunta.respuestas.all %}
                    <div class="respuesta">
                        <label>
                            <input type="radio" name="pregunta_{{ pregunta.id }}" value="{{ respuesta.id }}" required>
                            {{ respuesta.texto }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
            
            <button type="submit" class="btn-enviar">¡Descubrir mi Michi! 🐾</button>
        </form>
    </div>
</body>
</html>
